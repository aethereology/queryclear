name: Dependency security
on:
  workflow_dispatch:
  schedule:
    - cron: '21 9 * * 1'
permissions:
  contents: read
jobs:
  production-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
