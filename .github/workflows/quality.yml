name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Production dependency security
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Unit and contract tests
        run: npm test
      - name: Atomic audit recovery against ephemeral Redis
        env:
          REDIS_TEST_CONTAINER: ${{ job.services.redis.id }}
        run: node --test tests/audit-recovery-redis.integration.mjs
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Install browser for regression tests
        run: npx playwright install --with-deps chromium
      - name: Browser, responsive, SEO and accessibility regressions
        run: npm run test:e2e
      - name: Keep synthetic test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-report
          path: playwright-report/
          retention-days: 7
